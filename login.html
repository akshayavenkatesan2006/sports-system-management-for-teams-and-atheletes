<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports Management — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #151820; --card: #1c2030; --border: #252b3a;
      --accent: #f0b429; --blue: #3b82f6; --success: #22c55e; --danger: #ef4444;
      --text: #e2e8f0; --muted: #8492a6;
    }
    html, body {
      height: 100%; font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle at 20% 20%, rgba(240,180,41,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59,130,246,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%; max-width: 440px;
      padding: 20px;
      position: relative; z-index: 1;
    }

    /* Brand header */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 64px; height: 64px;
      background: var(--accent);
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(240,180,41,0.3);
    }
    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--text);
      line-height: 1;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab {
      flex: 1; padding: 10px;
      background: transparent; border: none;
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      border-radius: 8px; cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active { background: var(--card); color: var(--accent); }

    /* Form panels */
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 2px;
      margin-bottom: 22px; color: var(--text);
    }

    .fg { margin-bottom: 18px; }
    .fg label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); margin-bottom: 8px;
    }
    .fg input, .fg select {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .fg input:focus, .fg select:focus { border-color: var(--accent); }
    .fg input::placeholder { color: var(--muted); }
    select option { background: var(--surface); }

    .btn-submit {
      width: 100%; padding: 14px;
      background: var(--accent); color: #0d0f14;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .btn-submit:hover {
      background: #ffc940;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(240,180,41,0.4);
    }

    /* Message box */
    .msg {
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }
    .msg.err     { background: rgba(239,68,68,0.12);  border:1px solid rgba(239,68,68,0.3);  color: #fca5a5; display: block; }
    .msg.success { background: rgba(34,197,94,0.12);  border:1px solid rgba(34,197,94,0.3);  color: #86efac; display: block; }

    /* Default credentials hint */
    .hint {
      margin-top: 20px;
      padding: 14px;
      background: rgba(240,180,41,0.07);
      border: 1px solid rgba(240,180,41,0.2);
      border-radius: 9px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }
    .hint strong { color: var(--accent); }
  </style>
</head>
<body>

<div class="login-wrap">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div class="brand-name">SPORTS MANAGEMENT</div>
    <div class="brand-sub">Sign in to access the system</div>
  </div>

  <!-- Card -->
  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab" onclick="switchTab('register', this)">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="panel-login" class="form-panel active">
      <div class="form-title">Welcome Back</div>
      <div id="login-msg" class="msg"></div>
      <div class="fg">
        <label>Username</label>
        <input id="l-user" type="text" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="fg">
        <label>Password</label>
        <input id="l-pass" type="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="btn-submit" onclick="doLogin()">Sign In →</button>

      <div class="hint">
        Default admin: <strong>admin</strong> / <strong>admin123</strong><br>
        (Run the SQL to create this account)
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="panel-register" class="form-panel">
      <div class="form-title">Create Account</div>
      <div id="reg-msg" class="msg"></div>
      <div class="fg">
        <label>Username</label>
        <input id="r-user" type="text" placeholder="Choose a username">
      </div>
      <div class="fg">
        <label>Password</label>
        <input id="r-pass" type="password" placeholder="Choose a password">
      </div>
      <div class="fg">
        <label>Role</label>
        <select id="r-role">
          <option value="viewer">Viewer (View only)</option>
          <option value="admin">Admin (Full access)</option>
        </select>
      </div>
      <button class="btn-submit" onclick="doRegister()">Create Account →</button>
    </div>
  </div>
</div>

<script>
function switchTab(tab, btn) {
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  btn.classList.add('active');
}

function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'msg ' + type;
}

function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value.trim();
  if (!username || !password) { showMsg('login-msg', 'Please enter username and password.', 'err'); return; }

  fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  .then(r => r.json())
  .then(d => {
    if (d.status === 'success') {
      showMsg('login-msg', d.msg, 'success');
      setTimeout(() => { window.location.href = '/app'; }, 700);
    } else {
      showMsg('login-msg', d.msg, 'err');
    }
  })
  .catch(() => showMsg('login-msg', 'Server error. Is Flask running?', 'err'));
}

function doRegister() {
  const username = document.getElementById('r-user').value.trim();
  const password = document.getElementById('r-pass').value.trim();
  const role     = document.getElementById('r-role').value;
  if (!username || !password) { showMsg('reg-msg', 'Please fill in all fields.', 'err'); return; }
  if (password.length < 4)   { showMsg('reg-msg', 'Password must be at least 4 characters.', 'err'); return; }

  fetch('/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, role })
  })
  .then(r => r.json())
  .then(d => {
    showMsg('reg-msg', d.msg, d.status === 'success' ? 'success' : 'err');
    if (d.status === 'success') {
      setTimeout(() => {
        document.querySelectorAll('.tab')[0].click();
      }, 1500);
    }
  });
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const active = document.querySelector('.form-panel.active').id;
    if (active === 'panel-login') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
